<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treuhand Payment Agents</title>
<style>
:root { color-scheme: light;
  --bg:#f3f4f6; --card:#ffffff; --ink:#111827; --ink2:#4b5563; --mute:#6b7280; --line:#e5e7eb; --axis:#c4c8cf;
  --thead:#f8f9fb; --hover:#f6f8fa; --chip:#f1f3f5;

  --nav:#0b1f36; --nav2:#163556; --nav-ink:#c9d4e2; --nav-mute:#8195ad;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
  --s-control:#2a78d6; --s-fraud:#eb6834;
  --st-good:#0ca30c; --st-warn:#fab219; --st-crit:#d03b3b;

@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) { color-scheme: dark;
  --bg:#0e1116; --card:#161a21; --ink:#f3f4f6; --ink2:#c2c8d0; --mute:#8b93a0; --line:#262b34; --axis:#3a404b;
  --thead:#1b2029; --hover:#1c2129; --chip:#20252e; --brand:#4a8fe0; --brand-ink:#0b1220;
  --nav:#090c11; --nav2:#18202b; --shadow:0 1px 2px rgba(0,0,0,.4);
  --s-control:#3987e5; --s-fraud:#d95926;
  --t-good:#0ca30c; --t-warn:#fab219; --t-crit:#e66767; --heat:57,135,229; } }
:root[data-theme="dark"] { color-scheme: dark;
  --bg:#0e1116; --card:#161a21; --ink:#f3f4f6; --ink2:#c2c8d0; --mute:#8b93a0; --line:#262b34; --axis:#3a404b;
  --thead:#1b2029; --hover:#1c2129; --chip:#20252e; --brand:#4a8fe0; --brand-ink:#0b1220;
  --nav:#090c11; --nav2:#18202b; --shadow:0 1px 2px rgba(0,0,0,.4);
  --s-control:#3987e5; --s-fraud:#d95926;
  --t-good:#0ca30c; --t-warn:#fab219; --t-crit:#e66767; --heat:57,135,229; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Malgun Gothic",sans-serif; -webkit-font-smoothing:antialiased; }
a { color:inherit; }
.ic { flex:none; vertical-align:-3px; }
/* shell */
.app { display:grid; grid-template-columns:252px 1fr; min-height:100vh; }
aside { background:var(--nav); color:var(--nav-ink); position:sticky; top:0; height:100vh; overflow-y:auto; display:flex; flex-direction:column; }
aside .brand { display:flex; gap:10px; align-items:center; padding:0 16px; height:56px; border-bottom:1px solid rgba(255,255,255,.08); }
aside .logo { width:30px; height:30px; border-radius:7px; background:var(--logo); color:#fff; display:grid; place-items:center; font-weight:700; font-size:12px; letter-spacing:.02em; flex:none; }
aside .brand b { color:#fff; font-size:13.5px; display:block; line-height:1.25; white-space:nowrap; }
aside .brand small { color:var(--nav-mute); font-size:11px; }
aside .sec { color:var(--nav-mute); font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; padding:18px 20px 6px; }
aside a { display:flex; align-items:center; gap:10px; margin:1px 10px; padding:7px 10px; border-radius:6px; text-decoration:none; color:var(--nav-ink); font-size:13.5px; }
aside a .ic { color:var(--nav-mute); }
aside a:hover { background:var(--nav2); color:#fff; } aside a:hover .ic { color:#fff; }
aside a.on { background:var(--nav2); color:#fff; font-weight:600; box-shadow:inset 3px 0 0 #5b9be6; } aside a.on .ic { color:#fff; }
aside a .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
aside .badge { background:rgba(255,255,255,.14); color:#fff; }
aside .foot { margin-top:auto; padding:14px 20px; color:var(--nav-mute); font-size:11.5px; border-top:1px solid rgba(255,255,255,.08); line-height:1.8; }
.shell { min-width:0; display:flex; flex-direction:column; }
header.top { position:sticky; top:0; z-index:5; height:56px; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 28px; }
.crumbs { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--mute); flex:1; min-width:0; white-space:nowrap; overflow:hidden; }
.crumbs a { text-decoration:none; } .crumbs a:hover { color:var(--ink); } .crumbs b { color:var(--ink); font-weight:600; }
.tool { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink2); font:inherit; font-size:12.5px; text-decoration:none; cursor:pointer; white-space:nowrap; }
.tool:hover { background:var(--hover); color:var(--ink); }
.bell { position:relative; } .bell .cnt { position:absolute; top:-7px; right:-7px; background:var(--st-crit); color:#fff; font-size:10.5px; font-weight:700; min-width:18px; height:18px; border-radius:9px; display:grid; place-items:center; padding:0 4px; }
.env { font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:3px 8px; border-radius:4px; white-space:nowrap; }
.env.live { color:var(--t-good); background:color-mix(in srgb, var(--st-good) 13%, transparent); }
.env.replay { color:var(--brand); background:color-mix(in srgb, var(--brand) 12%, transparent); }
.user { display:flex; align-items:center; gap:9px; padding-left:14px; margin-left:4px; border-left:1px solid var(--line); }
.avatar { width:32px; height:32px; border-radius:50%; background:var(--brand); color:var(--brand-ink); display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; }
.user b { display:block; font-size:12.5px; line-height:1.25; white-space:nowrap; } .user small { font-size:11.5px; color:var(--mute); white-space:nowrap; }
main { padding:24px 28px 48px; max-width:1300px; width:100%; }
.phead { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.phead h1 { font-size:22px; font-weight:650; margin:0; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.phead p { margin:4px 0 0; color:var(--ink2); font-size:13.5px; }
.phead .acts { display:flex; gap:10px; align-items:center; color:var(--mute); font-size:12px; }
/* surfaces */
.meta { color:var(--mute); font-size:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-bottom:20px; overflow-x:auto; box-shadow:var(--shadow); }
.card > h2 { display:flex; align-items:center; gap:8px; }
.card > h2 + .sub { margin:2px -20px 16px; padding:0 20px 14px; border-bottom:1px solid var(--line); }
h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:15px; font-weight:650; margin:0 0 4px; } h3 { font-size:12px; font-weight:700; color:var(--ink2); text-transform:uppercase; letter-spacing:.05em; margin:16px 0 8px; }
.sub { color:var(--mute); font-size:12.5px; margin:0 0 14px; }
table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; }
th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
th { background:var(--thead); color:var(--mute); font-weight:650; font-size:11px; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; position:sticky; top:0; z-index:1; }
tr:hover > td { background:var(--hover); } .n { font-variant-numeric:tabular-nums; text-align:right; }
td a { color:var(--brand); text-decoration:none; font-weight:600; } td a:hover { text-decoration:underline; }
.pill { display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap;
        background:color-mix(in srgb, currentColor 11%, transparent); border:1px solid color-mix(in srgb, currentColor 24%, transparent); }
.pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.pill.ic-pill::before { display:none; }
.ok, .pay { color:var(--t-good); } .warn, .escalate { color:var(--t-warn); } .bad, .reject { color:var(--t-crit); }
.mute { color:var(--mute); } code { font:12px ui-monospace,Consolas,monospace; background:var(--chip); padding:1px 5px; border-radius:4px; }
pre { white-space:pre-wrap; background:var(--thead); border:1px solid var(--line); padding:12px; border-radius:6px; font:12.5px/1.5 ui-monospace,Consolas,monospace; margin:8px 0; }
textarea, input { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
input[type=checkbox] { padding:0; accent-color:var(--brand); }
textarea:focus, input:focus { outline:3px solid color-mix(in srgb, var(--focus) 25%, transparent); border-color:var(--focus); }
textarea { width:100%; min-height:190px; font-family:ui-monospace,Consolas,monospace; font-size:13px; }
label { font-size:13px; color:var(--ink2); }
.btn { display:inline-flex; align-items:center; gap:6px; height:34px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; padding:0 14px; cursor:pointer; font:inherit; font-size:13px; font-weight:550; box-shadow:0 1px 2px rgba(16,24,40,.05); white-space:nowrap; }
.btn:hover { background:var(--hover); }
.btn.primary { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); } .btn.primary:hover { filter:brightness(1.1); }
.btn.danger { background:var(--st-crit); border-color:var(--st-crit); color:#fff; } .btn.danger:hover { filter:brightness(1.08); }
.btn:disabled { opacity:.45; cursor:default; filter:none; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
.kpis.six { grid-template-columns:repeat(3,1fr); }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:20px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; box-shadow:var(--shadow); display:flex; gap:12px; align-items:flex-start; min-width:0; }
.kpi .kic { width:38px; height:38px; border-radius:8px; display:grid; place-items:center; flex:none; color:var(--brand); background:color-mix(in srgb, var(--brand) 10%, transparent); }
.kpi .kic.good { color:var(--t-good); background:color-mix(in srgb, var(--st-good) 13%, transparent); }
.kpi .kic.warn { color:var(--t-warn); background:color-mix(in srgb, var(--st-warn) 18%, transparent); }
.kpi .kic.crit { color:var(--t-crit); background:color-mix(in srgb, var(--st-crit) 12%, transparent); }
.kpi small { display:block; color:var(--ink2); font-size:12px; font-weight:550; }
.kpi b { display:block; font-size:22px; font-weight:650; line-height:1.3; white-space:nowrap; font-variant-numeric:tabular-nums; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.tabs { display:flex; gap:26px; flex-wrap:wrap; margin:0 0 20px; border-bottom:1px solid var(--line); }
.tabs a { text-decoration:none; color:var(--ink2); padding:10px 1px; border-bottom:2px solid transparent; margin-bottom:-1px; font-weight:550; display:inline-flex; gap:7px; align-items:center; font-size:13.5px; }
.tabs a:hover { color:var(--ink); } .tabs a.on { color:var(--brand); border-bottom-color:var(--brand); font-weight:650; }
.badge { font-size:11px; font-weight:700; background:var(--chip); color:var(--ink2); border-radius:99px; padding:0 7px; line-height:18px; }
.tabs a.on .badge { background:var(--brand); color:var(--brand-ink); }
details.more { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
details.more > summary { cursor:pointer; color:var(--ink2); font-weight:600; font-size:13px; list-style:none; display:flex; align-items:center; gap:6px; }
details.more > summary:hover { color:var(--ink); }
details.more > summary::before { content:""; width:6px; height:6px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(-45deg); margin:0 4px 0 2px; transition:transform .15s; }
details.more[open] > summary::before { transform:rotate(45deg); }
details.more > summary::-webkit-details-marker { display:none; }
details.more > div { margin-top:12px; overflow:auto; }
details.more > div:has(> table) { max-height:520px; border:1px solid var(--line); border-radius:6px; }
details.more > div:has(> table) td:last-child, details.more > div:has(> table) th:last-child { padding-right:14px; }
details.more > div > table tr:last-child > td { border-bottom:0; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink2); margin:0 0 12px; }
.legend span { display:inline-flex; align-items:center; gap:6px; } .legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
/* charts */
.bars { display:grid; grid-template-columns:minmax(110px,max-content) 1fr minmax(64px,max-content); gap:8px 12px; align-items:center; }
.bars .lb { font-size:13px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
.bars .lb a { text-decoration:none; } .bars .lb a:hover { text-decoration:underline; }
.bars .vl { font-size:12.5px; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
.track { position:relative; height:16px; display:flex; gap:2px; border-left:1px solid var(--axis); }
.seg { height:100%; min-width:0; } .seg:last-child { border-radius:0 4px 4px 0; } .seg:hover { filter:brightness(1.12); }
.bullet { position:relative; height:14px; background:var(--chip); border-radius:0 4px 4px 0; border-left:1px solid var(--axis); min-width:80px; }
.bullet .fill { position:absolute; left:0; top:3px; bottom:3px; border-radius:0 3px 3px 0; background:var(--s-control); }
.dot { width:8px; height:8px; border-radius:50%; flex:none; display:inline-block; }
/* status board */
.board { display:grid; grid-template-columns:minmax(170px,1.5fr) 120px 84px 1.2fr 1.1fr 150px; gap:0; font-size:13px; margin:-16px -20px 0; }
.board > div { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; min-width:0; }
.board > div:nth-child(6n+1) { padding-left:20px; } .board > div:nth-child(6n) { padding-right:20px; }
.board .hd { background:var(--thead); color:var(--mute); font-weight:650; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
.board a.cl { text-decoration:none; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--brand); }
.board a.cl:hover { text-decoration:underline; }
.board + .legend, .bars + .legend { margin-top:14px; }
.mini { display:flex; gap:2px; height:12px; flex:1; min-width:60px; }
.mini i { display:block; height:100%; } .mini i:last-child { border-radius:0 3px 3px 0; }
.heat td.n { min-width:54px; }
.pair { display:flex; flex-direction:column; gap:2px; border-left:1px solid var(--axis); }
.pair i { display:block; height:7px; border-radius:0 3px 3px 0; }
.alerts { margin:0 -20px; border-top:1px solid var(--line); }
.card-h + .alerts { margin-top:-2px; } .alerts table { font-size:13px; } .alerts td, .alerts th { vertical-align:middle; }
.alerts td:first-child, .alerts th:first-child { padding-left:20px; } .alerts td:last-child, .alerts th:last-child { padding-right:20px; }
.alerts tr:last-child > td { border-bottom:0; }
.sig { display:inline-block; font-size:12px; margin:1px 6px 1px 0; }
.card-h { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.card-h .sub { border:0 !important; margin:2px 0 14px !important; padding:0 !important; }
.uplot { display:grid; grid-template-columns:120px 1fr; row-gap:6px; column-gap:12px; margin:2px 0 18px; }
.uplot .lb { font-size:12.5px; color:var(--ink2); align-self:center; white-space:nowrap; }
.uplot .lane { position:relative; height:34px; border-left:1px solid var(--axis); background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat; }
.uplot .zone { position:absolute; top:0; bottom:0; left:0; background:color-mix(in srgb, var(--st-crit) 8%, transparent); border-right:1px dashed color-mix(in srgb, var(--st-crit) 50%, transparent); }
.uplot .zone b { position:absolute; top:-1px; left:6px; font-size:10.5px; font-weight:700; color:var(--t-crit); letter-spacing:.04em; }
.uplot .pt { position:absolute; width:12px; height:12px; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 2px var(--card); cursor:pointer; }
.uplot .pt:hover { transform:translate(-50%,-50%) scale(1.35); }
.uplot .ax { position:relative; height:16px; font-size:11px; color:var(--mute); }
.uplot .ax span { position:absolute; transform:translateX(-50%); white-space:nowrap; }
.rank { display:inline-grid; place-items:center; min-width:24px; height:24px; border-radius:6px; background:var(--chip); font-weight:700; font-size:12px; }
.rank.top { background:var(--brand); color:var(--brand-ink); }
.flow { display:flex; align-items:stretch; gap:6px; flex-wrap:wrap; margin:0 0 20px; }
.flow-s { flex:1; min-width:120px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:3px; box-shadow:var(--shadow); }
.flow-s .kic { width:30px; height:30px; border-radius:7px; display:grid; place-items:center; color:var(--brand); background:color-mix(in srgb, var(--brand) 10%, transparent); margin-bottom:4px; }
.flow-s b { font-size:13px; } .flow-s small { font-size:11.5px; color:var(--mute); }
.card .flow-s { box-shadow:none; background:var(--thead); }
.flow-a { display:flex; align-items:center; color:var(--mute); }
.stepno { display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--brand); color:var(--brand-ink); font-size:12px; font-weight:700; margin-right:4px; }
.split { display:flex; gap:10px; align-items:flex-end; margin:4px 0 6px; }
.split-p { display:flex; flex-direction:column; gap:4px; min-width:0; } .split-p b { font-size:13px; } .split-p small { font-size:11.5px; color:var(--mute); }
.split-bar { height:30px; border-radius:6px; background:color-mix(in srgb, var(--s-control) 22%, transparent); overflow:hidden; display:flex; }
.split-bar.test { background:color-mix(in srgb, var(--ink2) 18%, transparent); }
.split-bar i { display:block; height:100%; background:var(--s-fraud); }
.split-gap { width:18px; border-left:2px dashed var(--line); align-self:stretch; }
.cm { display:grid; grid-template-columns:92px 1fr 1fr; gap:4px; max-width:420px; }
.cm-t { grid-column:1 / -1; font-size:12px; font-weight:700; color:var(--ink2); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
.cm-h { font-size:12px; color:var(--ink2); text-align:center; align-self:end; padding:2px; } .cm-v { align-self:center; text-align:right; }
.cm-c { border-radius:8px; padding:14px 10px; text-align:center; display:flex; flex-direction:column; gap:2px; border:1px solid var(--line); }
.cm-c b { font-size:24px; font-variant-numeric:tabular-nums; } .cm-c small { font-size:11.5px; font-weight:700; color:var(--ink2); } .cm-c i { font-style:normal; font-size:11px; }
#tip { position:fixed; pointer-events:none; z-index:10; background:var(--card); color:var(--ink); border:1px solid var(--line);
       border-radius:6px; padding:6px 9px; font-size:12.5px; box-shadow:0 6px 18px rgba(0,0,0,.14); display:none; max-width:300px; }
@media (max-width:1100px) { .user div { display:none; } }
@media (max-width:900px) { .app { grid-template-columns:1fr; } aside { position:static; height:auto; flex-direction:row; flex-wrap:wrap; gap:4px; padding:8px; }
  aside .brand { width:100%; height:auto; padding:6px 8px 10px; } aside .sec, aside .foot { display:none; } aside a { flex:none; margin:0; }
  .grid2, .kpis.six { grid-template-columns:1fr; } main { padding:16px; } header.top { padding:0 16px; } .user, .env { display:none; }
  .board { grid-template-columns:1.5fr 1fr 1fr; } .board .opt { display:none; } .board > div { padding-left:12px !important; padding-right:12px !important; } }
</style>
</head>

<div class="app"><aside id="side"></aside><div class="shell"><header class="top" id="top"></header><main id="main"></main></div></div>

<script>
// ---------------------------------------------------------------- language
let LANG = (() => { try { return localStorage.getItem("lang") || "ko"; } catch (e) { return "ko"; } })();
const t = (ko, en) => LANG === "ko" ? ko : en;
function setLang(l) { LANG = l; try { localStorage.setItem("lang", l); } catch (e) {} document.documentElement.lang = l; route(); }
const RISK_KO = {E_IBAN_CHANGED: "계좌 변경", R_IBAN_INVALID: "잘못된 IBAN", R_DUPLICATE: "중복 청구", E_VAT_MISMATCH: "금액 합계 불일치",

    ${m.attacks ? more(t("공격 시나리오", "Attack scenarios"), `<table><tr><th>${t("시나리오", "Scenario")}</th><th class="n">${t("시도", "Attempts")}</th><th class="n">${t("차단", "Blocked")}</th><th>${t("잡은 검사", "Caught by")}</th></tr>

    ${more(t("사무소 공통 매뉴얼 (gen1)", "Firm-wide manual (generation 1)"), `<pre>${esc(s.manual)}</pre>`)}</div>`;
