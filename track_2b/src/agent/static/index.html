async function deploy(cid) {
  ONB[cid] = "busy"; route();
  try { const r = await post(`/api/clients/${cid}/agent/onboard`); ONB[cid] = r.steps; }
  catch (e) { ONB[cid] = [{step: "mandate", ok: false, detail: e.message}]; }
  route();
}
async function agentAct(cid, what) {
  try { await post(`/api/clients/${cid}/agent/${what}`, what === "kill" ? {note: $("killnote").value} : {}); route(); } catch (e) { alert(e.message); }
}
async function saveSettings(cid) {
  const actions = [...document.querySelectorAll(".actchk")].filter(x => x.checked).map(x => x.value);
  try { await post(`/api/clients/${cid}/agent/settings`, {max_single_chf: Number($("cap").value), actions}); route(); }
  catch (e) { $("sstatus").textContent = e.message; }
}
async function revokeMandate(cid) {
  if (!confirm(t("고객이 위임을 취소하는 상황을 시연할까요? 이 고객사의 에이전트는 더 이상 일할 수 없어요.", "Simulate the client revoking its mandate? Its agent can no longer act for it."))) return;
  await post(`/api/clients/${cid}/revoke`); route();
}
async function publishLessons(cid) {
  $("lstatus").textContent = t("Apertus에게 요청 중…", "asking Apertus…");
  try { await post(`/api/clients/${cid}/lessons/publish`); route(); } catch (e) { $("lstatus").textContent = e.message; }
}
async function attackGate(cid, kind) {

    manual: {title: t("사무소 공통 매뉴얼 (gen1)", "Firm-wide manual (generation 1)"), render: () => `<pre>${esc(s.manual)}</pre>`},

  $("main").innerHTML = `${pageHead(t("에이전트 평가", "Agent evaluation"), t(`합성 테스트 청구서 ${m.n_test}건 (4개 언어) · ${m.model} · 그중 ${nonpay}건은 자동 지급하면 안 되는 건 · ✱ 테스트 결과를 본 뒤 추가 (블라인드 아님)`, `${m.n_test} synthetic test invoices in four languages · ${m.model} · ${nonpay} must not be paid automatically · ✱ added after seeing test results (not blind)`))}

// ---------------------------------------------------------------- boxes the viewer can arrange (saved in this browser only)
let BOARD = null, EDIT = false, DRAG = null;
const SIZES = () => [["s", "⅓"], ["m", "½"], ["w", "⅔"], ["l", t("전체", "full")]];
function board(key, widgets, defaults) {  // widgets: {id: {title, icon?, render}}; defaults: [[id, size], ...] shown at first
  BOARD = {key, widgets, defaults};
  return `<div id="board"></div>`;
}
function layoutOf(b) {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("layout:" + b.key)); } catch (e) {}
  return Array.isArray(saved) ? saved.filter(x => Array.isArray(x) && b.widgets[x[0]] && SIZES().some(([s]) => s === x[1]))
    : b.defaults.filter(([id]) => b.widgets[id]).map(x => [...x]);
}
function saveLayout(l) { try { localStorage.setItem("layout:" + BOARD.key, JSON.stringify(l)); } catch (e) {} renderBoard(); }
function renderBoard() {
  const b = BOARD, l = layoutOf(b), shown = new Set(l.map(([id]) => id)), hidden = Object.keys(b.widgets).filter(id => !shown.has(id));
  const title = id => `${b.widgets[id].icon ? ic(b.widgets[id].icon, 17) + " " : ""}${esc(b.widgets[id].title)}`;
  const ctl = (k, size) => `<div class="wctl" role="group" aria-label="${t("상자 배치", "box layout")}">
      <button class="wbtn" onclick="moveW(${k},-1)" aria-label="${t("위로", "move up")}" ${k ? "" : "disabled"}>↑</button><button class="wbtn" onclick="moveW(${k},1)" aria-label="${t("아래로", "move down")}" ${k < l.length - 1 ? "" : "disabled"}>↓</button>
      ${SIZES().map(([s, lb]) => `<button class="wbtn ${s === size ? "on" : ""}" onclick="sizeW(${k},'${s}')" aria-pressed="${s === size}">${lb}</button>`).join("")}
      <button class="wbtn" onclick="hideW(${k})" aria-label="${t("숨기기", "hide")}" title="${t("숨기기 (아래 상세로)", "hide (moves to Details)")}">✕</button></div>`;
  $("board").innerHTML = `<div class="wbar">
      ${EDIT ? `<span class="meta">${t("제목을 끌어 옮기거나 ↑↓로 순서를 바꾸고, ⅓·½·⅔·전체로 크기를 정해요. 이 브라우저에만 저장돼요.", "Drag a title or use ↑↓ to reorder, pick ⅓ · ½ · ⅔ · full for the size. Saved in this browser only.")}</span>
        ${hidden.length ? `<select onchange="addW(this.value)" aria-label="${t("상자 추가", "add a box")}"><option value="">${t("+ 상자 추가", "+ Add a box")}</option>${hidden.map(id => `<option value="${id}">${esc(b.widgets[id].title)}</option>`).join("")}</select>` : ""}
        <button class="btn" onclick="resetW()">${t("기본 배치로", "Reset")}</button>` : ""}
      <button class="btn ${EDIT ? "primary" : ""}" onclick="EDIT=!EDIT;renderBoard()">${EDIT ? t("완료", "Done") : `${ic("grid", 15)} ${t("화면 편집", "Edit layout")}`}</button></div>
    <div class="wgrid ${EDIT ? "editing" : ""}">${l.map(([id, size], k) => `<div class="card w-${size}" data-k="${k}"
        ${EDIT ? `draggable="true" ondragstart="dragW(event,${k})" ondragover="overW(event,this)" ondragleave="this.classList.remove('over')" ondrop="dropW(event,${k})" ondragend="DRAG=null"` : ""}>
      <div class="card-h"><h2>${EDIT ? `<span class="grip" aria-hidden="true">⠿</span>` : ""}${title(id)}</h2>${EDIT ? ctl(k, size) : ""}</div>${b.widgets[id].render()}</div>`).join("")}</div>
    ${hidden.length ? `<div class="card" style="margin-top:16px"><h2>${t("상세", "Details")}</h2>${hidden.map(id => more(b.widgets[id].title, b.widgets[id].render())).join("")}</div>` : ""}`;
}
function moveW(k, d) { const l = layoutOf(BOARD), j = k + d; if (j < 0 || j >= l.length) return; [l[k], l[j]] = [l[j], l[k]]; saveLayout(l); }
function sizeW(k, s) { const l = layoutOf(BOARD); l[k][1] = s; saveLayout(l); }
function hideW(k) { const l = layoutOf(BOARD); l.splice(k, 1); saveLayout(l); }
function addW(id) { if (!id) return; const l = layoutOf(BOARD); l.push([id, "m"]); saveLayout(l); }
function resetW() { try { localStorage.removeItem("layout:" + BOARD.key); } catch (e) {} renderBoard(); }
function dragW(e, k) { DRAG = k; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", String(k)); } catch (x) {} }
function overW(e, el) { e.preventDefault(); el.classList.add("over"); }
function dropW(e, k) { e.preventDefault(); if (DRAG == null || DRAG === k) return; const l = layoutOf(BOARD), [it] = l.splice(DRAG, 1); l.splice(k, 0, it); DRAG = null; saveLayout(l); }
function agentList(rows) {  // one agent per client: which version, whether it may work, how it did

    <div style="overflow-x:auto"><table class="agents"><tr><th>${t("고객사 (담당자는 마우스 올리면)", "Client")}</th><th>${t("버전", "Version")}</th><th>${t("상태", "Status")}</th><th class="n">${t("건당 상한", "Cap")}</th><th>${t("자가 점검", "Self-test")}</th>
      <th class="n">${t("테스트 정답", "Test correct")}</th><th class="n">${t("잘못 지급", "Wrong paid")}</th><th class="n">${t("놓친 정상", "Missed")}</th><th class="n">${t("이달 지급·보류·거절", "Paid·held·rej.")}</th></tr>
    ${rows.map(r => `<tr><td title="${esc(`${r.client} · ${r.owner}`)}"><a href="#/c/${r.client_id}">${esc(r.client)}</a></td>
      <td data-tip="${esc(r.generation ? `${r.seat}.v${r.generation} · ${r.did} · ${t("매뉴얼", "manual")} sha256 ${r.manual_sha256.slice(0, 16)}… · ${r.model}` : "")}">${r.generation
        ? `<a href="#/c/${r.client_id}/agent"><b>v${r.generation}</b></a> <span class="meta">· ${t("매뉴얼", "manual")} ${r.manual_generation}${r.earlier_versions ? ` · ${t(`이전 ${r.earlier_versions}`, `${r.earlier_versions} retired`)}` : ""}</span>`
        : `<span class="mute">${t("배치 안 됨", "not deployed")}</span>`}</td>
      <td>${st(r)}</td><td class="n">${r.cap ? chf0(r.cap) : "–"}</td>
      <td>${r.self_test == null ? `<span class="mute">–</span>` : r.self_test ? `<span class="ok" data-tip="${esc(t("정상 요청 통과, 위조·재탕 거부", "own request passed, forged and replayed refused"))}">${ic("check", 13)} ${t("통과", "ok")}</span>` : `<span class="bad">${ic("ban", 13)} ${t("실패", "failed")}</span>`}</td>
      <td class="n">${r.test.n ? `${r.test.correct} / ${r.test.n}` : "–"}</td>
      <td class="n ${r.test.wrong_payments ? "bad" : ""}">${r.test.n ? `${r.test.wrong_payments} / ${r.test.must_not_pay}` : "–"}</td>
      <td class="n ${r.test.missed ? "warn" : ""}">${r.test.n ? r.test.missed : "–"}</td>
      <td class="n" data-tip="${esc(t(`대기 ${r.month.queue_open}건`, `${r.month.queue_open} waiting`))}">${r.month.paid} · ${r.month.escalated} · ${r.month.rejected}</td></tr>`).join("")}</table></div>`;
}
function holdoutCard(h, sys, nm) {
  const nonpay = h.risk.B_logistic.positives;  // invoices that must not be paid automatically
  const r = h.risk.A_logistic, missed = sys.filter(k => h.metrics[k].missed_payment_rate > 0).length;
  return `<p class="sub">${t(`승격 교훈까지의 설계를 고정한 뒤 같은 생성기에서 다른 시드(${h.seed})로 뽑은 청구서. 테스트 결과에 맞춘 게 아닌지 확인하는 용도예요. 한 번 더 보기는 그 뒤에 추가했어요. 잘못 지급, ${nonpay}건 중.`, `Drawn once from the same generator with another seed (${h.seed}) after freezing the design up to the promoted lessons, to check we did not tune on the test set; the second look came later. Wrong payments, of ${nonpay}.`)}</p>
    ${scaled(sys.map(k => ({label: nm(k), v: h.metrics[k].wrong_payments, value: `${h.metrics[k].wrong_payments} / ${nonpay}`})), nonpay, {color: C.rejected})}
    <p class="meta">${t(`위험 점수(고정된 모델) 사기 ROC AUC ${r.roc_auc} · 정상 지급을 놓친 시스템 ${missed}개 · 같은 생성기라 처음 보는 유형에 대한 증거는 아니에요.`, `Risk score (frozen model): fraud ROC AUC ${r.roc_auc} · systems that missed a legitimate payment: ${missed} · same generator, so not evidence for unseen invoice types.`)}</p>`;
