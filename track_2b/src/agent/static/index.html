<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treuhand Payment Agents</title>
<style>
:root { color-scheme: light;
  --bg:#f9f9f7; --card:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --mute:#898781; --line:#e1e0d9; --axis:#c3c2b7;
  --acc:#c8102e; --chip:#efeee9; --side:#f2f1ed;
  --s-control:#2a78d6; --s-fraud:#eb6834;
  --st-good:#0ca30c; --st-warn:#fab219; --st-crit:#d03b3b;
  --t-good:#006300; --t-warn:#8a5a00; --t-crit:#b42323; --heat:42,120,214; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) { color-scheme: dark;
  --bg:#0d0d0d; --card:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --mute:#898781; --line:#2c2c2a; --axis:#383835;
  --acc:#ff4d61; --chip:#262624; --side:#141413; --s-control:#3987e5; --s-fraud:#d95926;
  --t-good:#0ca30c; --t-warn:#fab219; --t-crit:#e66767; --heat:57,135,229; } }
:root[data-theme="dark"] { color-scheme: dark;
  --bg:#0d0d0d; --card:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --mute:#898781; --line:#2c2c2a; --axis:#383835;
  --acc:#ff4d61; --chip:#262624; --side:#141413; --s-control:#3987e5; --s-fraud:#d95926;
  --t-good:#0ca30c; --t-warn:#fab219; --t-crit:#e66767; --heat:57,135,229; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14.5px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
a { color:inherit; }
.app { display:grid; grid-template-columns:236px 1fr; min-height:100vh; }
aside { background:var(--side); border-right:1px solid var(--line); padding:14px 10px; position:sticky; top:0; height:100vh; overflow-y:auto; }
aside .brand { font-weight:700; font-size:15px; padding:2px 8px 12px; } aside .brand i { color:var(--acc); font-style:normal; }
aside .sec { color:var(--mute); font-size:11.5px; letter-spacing:.04em; padding:12px 8px 4px; }
aside a { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; text-decoration:none; color:var(--ink2); font-size:14px; }
aside a:hover { background:var(--chip); } aside a.on { background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 0 0 1px var(--line); }
aside a .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dot { width:8px; height:8px; border-radius:50%; flex:none; display:inline-block; }
.badge { font-size:11px; background:var(--chip); color:var(--ink2); border-radius:99px; padding:0 7px; }
aside .foot { padding:12px 8px; color:var(--mute); font-size:12px; }
main { padding:20px 24px; max-width:1220px; width:100%; }
.meta { color:var(--mute); font-size:12.5px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; overflow-x:auto; }
h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:15px; margin:0 0 4px; } h3 { font-size:13.5px; margin:12px 0 6px; }
.sub { color:var(--ink2); font-size:13px; margin:0 0 12px; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--ink2); font-weight:600; } .n { font-variant-numeric:tabular-nums; text-align:right; }
.pill { display:inline-flex; align-items:center; gap:5px; padding:1px 8px; border-radius:99px; font-size:12px; font-weight:600; background:var(--chip); white-space:nowrap; }
.pill::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
.ok, .pay { color:var(--t-good); } .warn, .escalate { color:var(--t-warn); } .bad, .reject { color:var(--t-crit); }
.mute { color:var(--mute); } code { font-size:12px; }
pre { white-space:pre-wrap; background:var(--chip); padding:10px; border-radius:6px; font-size:12.5px; margin:8px 0; }
textarea, input { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:7px; }
textarea { width:100%; min-height:190px; font-family:ui-monospace,Consolas,monospace; font-size:13px; }
.btn { border:1px solid var(--line); background:var(--chip); color:var(--ink); border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
.btn.primary { background:var(--acc); border-color:var(--acc); color:#fff; } .btn:disabled { opacity:.45; cursor:default; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
.kpi small { color:var(--ink2); font-size:12.5px; } .kpi b { display:block; font-size:22px; font-weight:650; white-space:nowrap; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.tabs { display:flex; gap:4px; flex-wrap:wrap; margin:12px 0 16px; border-bottom:1px solid var(--line); padding-bottom:8px; }
.tabs a { text-decoration:none; color:var(--ink2); padding:6px 12px; border-radius:6px; } .tabs a.on { background:var(--chip); color:var(--ink); font-weight:600; }
details.more { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
details.more > summary { cursor:pointer; color:var(--ink2); font-weight:600; font-size:13.5px; list-style:none; }
details.more > summary::before { content:"▸ "; } details.more[open] > summary::before { content:"▾ "; }
details.more > summary::-webkit-details-marker { display:none; }
details.more > div { margin-top:10px; overflow-x:auto; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink2); margin:0 0 10px; }
.legend span { display:inline-flex; align-items:center; gap:6px; } .legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
.bars { display:grid; grid-template-columns:minmax(110px,max-content) 1fr minmax(64px,max-content); gap:7px 10px; align-items:center; }
.bars .lb { font-size:13px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
.bars .lb a { text-decoration:none; } .bars .lb a:hover { text-decoration:underline; }
.bars .vl { font-size:12.5px; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
.track { position:relative; height:16px; display:flex; gap:2px; border-left:1px solid var(--axis); }
.seg { height:100%; min-width:0; } .seg:last-child { border-radius:0 4px 4px 0; } .seg:hover { filter:brightness(1.12); }
.bullet { position:relative; height:14px; background:var(--chip); border-radius:0 4px 4px 0; border-left:1px solid var(--axis); min-width:80px; }
.bullet .fill { position:absolute; left:0; top:3px; bottom:3px; border-radius:0 3px 3px 0; background:var(--s-control); }
/* status board */
.board { display:grid; grid-template-columns:minmax(170px,1.5fr) 112px 84px 1.2fr 1.1fr 140px; gap:0; font-size:13px; }
.board > div { padding:9px 8px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; min-width:0; }
.board .hd { color:var(--ink2); font-weight:600; font-size:12.5px; }
.board a.cl { text-decoration:none; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.board a.cl:hover { text-decoration:underline; }
.mini { display:flex; gap:2px; height:12px; flex:1; min-width:60px; }
.mini i { display:block; height:100%; } .mini i:last-child { border-radius:0 3px 3px 0; }
.heat td.n { min-width:54px; }
.pair { display:flex; flex-direction:column; gap:2px; border-left:1px solid var(--axis); }
.pair i { display:block; height:7px; border-radius:0 3px 3px 0; }
#tip { position:fixed; pointer-events:none; z-index:10; background:var(--card); color:var(--ink); border:1px solid var(--line);
       border-radius:6px; padding:6px 9px; font-size:12.5px; box-shadow:0 4px 14px rgba(0,0,0,.12); display:none; max-width:300px; }
@media (max-width:900px) { .app { grid-template-columns:1fr; } aside { position:static; height:auto; display:flex; flex-wrap:wrap; gap:4px; }
  aside .sec, aside .foot { display:none; } aside a { flex:none; } .grid2 { grid-template-columns:1fr; } main { padding:16px; }
  .board { grid-template-columns:1.5fr 1fr 1fr; } .board .opt { display:none; } }
</style>
</head>
<body>
<div class="app"><aside id="side"></aside><main id="main"></main></div>
<div id="tip"></div>
<script>
// ---------------------------------------------------------------- language
let LANG = (() => { try { return localStorage.getItem("lang") || "ko"; } catch (e) { return "ko"; } })();
const t = (ko, en) => LANG === "ko" ? ko : en;
function setLang(l) { LANG = l; try { localStorage.setItem("lang", l); } catch (e) {} document.documentElement.lang = l; route(); }
const RISK_KO = {E_IBAN_CHANGED: "계좌 변경", R_IBAN_INVALID: "잘못된 IBAN", R_DUPLICATE: "중복 청구", E_VAT_MISMATCH: "금액 합계 불일치",
  E_WRONG_ADDRESSEE: "다른 회사 앞 청구서", MODEL_FLAGGED: "Apertus 검토 경고 (재촉·비밀 요구 등)", E_NEW_VENDOR: "새 거래처",
  E_LIMIT_SINGLE: "건당 한도 초과", E_LIMIT_MONTH: "월 한도 초과", R_SCOPE: "위임 범위 밖", R_REVOKED: "위임 취소",
  CREDENTIAL_INVALID: "위임장 서명 무효", E_PRESSURE: "사기성 재촉 문구", EXTRACTION_INCOMPLETE: "청구서 판독 실패", CATEGORY_UNCLEAR: "지출 유형 불명"};
const GATE_KO = {OK: "통과", G1_SIGNATURE_INVALID: "서명 위조", G1_PAYLOAD_TAMPERED: "서명 후 내용 변조", G2_REPLAY: "재탕 요청",
  G2_STALE: "오래된 요청", G3_NO_VALID_ENTITY_CARD: "등록되지 않은 에이전트", G3_AGENT_REVOKED: "정지된 에이전트",
  G3_NO_AGENT_FOR_CLIENT: "담당 에이전트 없음", G4_NO_VALID_BADGE: "배지 없음", G4_BADGE_EXPIRED: "배지 만료",
  G4_ACTION_NOT_ALLOWED: "허용되지 않은 행동", G4_CLIENT_NOT_COVERED: "담당 고객사 아님", G4_ABOVE_BADGE_CAP_NO_GRANT: "상한 초과 (사람 승인 없음)",
  G5_MANDATE_INVALID: "위임장 무효", G5_MANDATE_REVOKED: "위임 취소됨", G5_MANDATE_EXPIRED: "위임 만료"};
const ACTION_KO = {"ledger.opened": "장부 개설", "mandate.registered": "위임장 등록", "identity.issued": "사원증 발급", "delegation.issued": "배지 발급",
  "policy.changed": "매뉴얼 지정", "manual.published": "매뉴얼 발행", "payment.decide": "지급 판단", "payment.file": "지급 파일 생성",
  "request.rejected": "요청 거부", "agent.revoked": "에이전트 정지", "consent.granted": "사람 승인", "consent.denied": "사람 거절", "mandate.revoked": "위임 취소"};
const ATTACK_KO = {"legitimate request (control)": "정상 요청 (대조군)", "forged signature": "서명 위조", "tampered amount / IBAN after signing": "서명 후 금액·IBAN 변조",
  "replayed request": "재탕 요청", "stale request (1 h old)": "오래된 요청 (1시간 전)", "unknown agent key": "모르는 에이전트 키",
  "revoked agent (v1 after kill switch)": "정지된 에이전트 (긴급 정지 후 v1)", "agent of one client acting for another client": "다른 고객사 일을 하려는 에이전트",
  "amount above badge cap, no human grant": "상한 초과 금액 (사람 승인 없음)", "expired badge": "만료된 배지", "mandate limits tampered": "위임장 한도 변조",
  "mandate delegated to someone else": "다른 곳에 위임된 위임장", "mandate revoked by client": "고객이 취소한 위임장"};
const EXTRACT_KO = {iban: "IBAN", total_chf: "합계 금액", invoice_no: "청구서 번호", vendor: "거래처", addressee: "수신인", parsed: "올바른 JSON"};
const EXTRACT_EN = {iban: "IBAN", total_chf: "total amount", invoice_no: "invoice number", vendor: "supplier", addressee: "addressee", parsed: "valid JSON"};
const DEC_KO = {pay: "지급", escalate: "보류", reject: "거절"};
const riskName = (code, en) => t(RISK_KO[code] || en || code, en || code);
const gateName = g => LANG === "ko" && GATE_KO[g] ? `${GATE_KO[g]}` : g;
const actName = a => LANG === "ko" ? (ACTION_KO[a] || a) : a;
const decName = d => LANG === "ko" ? (DEC_KO[d] || d) : d;
const kindName = k => k === "fraud" ? t("사기 신호", "fraud signal") : t("통제·한도", "control limit");

// ---------------------------------------------------------------- helpers
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chf = x => x == null || x === "" ? "–" : Number(x).toLocaleString("de-CH",{minimumFractionDigits:2,maximumFractionDigits:2});
const chf0 = x => x == null ? "–" : Number(x).toLocaleString("de-CH",{maximumFractionDigits:0});
const short = d => d ? esc(d.slice(0, 16) + "…" + d.slice(-6)) : "–";
const dec = d => `<span class="pill ${esc(d)}">${esc(decName(d))}</span>`;
async function api(path, opts) {
  const r = await fetch(path, opts); const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText); return j;
}
const post = (path, body) => api(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body||{})});
const C = {paid:"var(--st-good)", escalated:"var(--st-warn)", rejected:"var(--st-crit)", fraud:"var(--s-fraud)", control:"var(--s-control)"};
const decisionLegend = () => [[t("지급", "paid"), C.paid], [t("보류 (사람 확인)", "held for a human"), C.escalated], [t("거절", "rejected"), C.rejected]];
const riskLegend = () => [[t("사기 신호", "fraud signal"), C.fraud], [t("통제·한도", "control limit"), C.control]];
const legend = items => `<div class="legend">${items.map(([l, c]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join("")}</div>`;
const more = (summary, html, open = false) => `<details class="more" ${open ? "open" : ""}><summary>${esc(summary)}</summary><div>${html}</div></details>`;
function stacked(rows, fmt = x => x) {  // one shared scale so rows compare
  const max = Math.max(1, ...rows.map(r => r.parts.reduce((s, p) => s + p.v, 0)));
  return `<div class="bars">${rows.map(r => { const tot = r.parts.reduce((s, p) => s + p.v, 0);
    return `<div class="lb">${r.href ? `<a href="${r.href}">${esc(r.label)}</a>` : esc(r.label)}</div>
      <div class="track">${r.parts.filter(p => p.v > 0).map(p => `<div class="seg" style="width:${100 * p.v / max}%;background:${p.color}"
        data-tip="${esc(`${r.label} · ${p.name}: ${fmt(p.v)}`)}"></div>`).join("")}</div>
      <div class="vl">${r.value ?? fmt(tot)}</div>`; }).join("")}</div>`;
}
const bars = (rows, opts = {}) => stacked(rows.map(r => ({label: r.label, href: r.href, value: r.value ?? (opts.fmt || (x => x))(r.v),
  parts: [{v: r.v, color: r.color || opts.color || C.control, name: r.tip || ""}]})), opts.fmt || (x => x));
function scaled(rows, max, opts = {}) {
  return `<div class="bars">${rows.map(r => `<div class="lb">${esc(r.label)}</div>
    <div class="track"><div class="seg" style="width:${100 * Math.max(0, r.v) / max}%;background:${r.color || opts.color || C.control}"
      data-tip="${esc(`${r.label}: ${r.value ?? r.v}`)}"></div></div><div class="vl">${r.value ?? r.v}</div>`).join("")}</div>`;
}
const bullet = (v, max, tip) => `<div class="bullet" style="flex:1" data-tip="${esc(tip)}"><div class="fill" style="width:${Math.min(100, 100 * v / max)}%"></div></div>`;
document.addEventListener("mousemove", e => {
  const el = e.target.closest && e.target.closest("[data-tip]"), tip = $("tip");
  if (!el) { tip.style.display = "none"; return; }
  tip.textContent = el.dataset.tip; tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px";
});

// ---------------------------------------------------------------- sidebar + routing
let OV = null;
const statusOf = c => c.mandate.revoked ? {k: "revoked", color: "var(--mute)", label: t("위임 취소", "mandate revoked")}
  : !c.agent.active ? {k: "off", color: "var(--st-crit)", label: t("에이전트 정지", "agent off")}
  : (c.fraud_signals > 0 || c.queue_open > 0) ? {k: "attention", color: "var(--st-warn)", label: t("확인 필요", "needs attention")}
  : {k: "ok", color: "var(--st-good)", label: t("정상", "all clear")};
async function sidebar(active) {
  OV = await api("/api/overview");
  $("side").innerHTML = `<div class="brand"><i>■</i> ${esc(OV.firm)}</div>
    <a href="#/" class="${active === "overview" ? "on" : ""}"><span class="nm">${t("전체 현황", "Overview")}</span></a>
    <div class="sec">${t("고객사", "CLIENTS")}</div>
    ${OV.clients.map(c => { const s = statusOf(c); return `<a href="#/c/${c.client_id}" class="${active === c.client_id ? "on" : ""}" title="${esc(c.name)} · ${esc(s.label)}">
      <span class="dot" style="background:${s.color}"></span><span class="nm">${esc(c.name)}</span>${c.queue_open ? `<span class="badge">${c.queue_open}</span>` : ""}</a>`; }).join("")}
    <div class="sec">${t("사무소", "FIRM")}</div>
    <a href="#/evaluation" class="${active === "evaluation" ? "on" : ""}"><span class="nm">${t("평가 결과", "Evaluation")}</span></a>
    <a href="#/ledger" class="${active === "ledger" ? "on" : ""}"><span class="nm">${t("장부", "Ledger")}</span></a>
    <div class="foot">${esc(OV.model)} · ${esc(OV.llm_mode)}<br>
      <span class="dot" style="background:var(--st-good)"></span> ${t("정상", "clear")} &nbsp;<span class="dot" style="background:var(--st-warn)"></span> ${t("확인 필요", "attention")}<br>
      <span class="dot" style="background:var(--st-crit)"></span> ${t("에이전트 정지", "agent off")} &nbsp;<span class="dot" style="background:var(--mute)"></span> ${t("위임 취소", "no mandate")}
      <div class="row"><button class="btn" onclick="setLang('${LANG === "ko" ? "en" : "ko"}')">${LANG === "ko" ? "English" : "한국어"}</button></div></div>`;
}
async function route() {
  const h = location.hash.replace(/^#\/?/, "").split("/");
  await sidebar(h[0] === "c" ? h[1] : h[0] || "overview");
  if (h[0] === "c") return clientPage(h[1], h[2] || "overview");
  if (h[0] === "evaluation") return evaluation();
  if (h[0] === "ledger") return ledgerPage();
  return dashboard();
}
window.addEventListener("hashchange", route);

// ---------------------------------------------------------------- overview
const riskSum = (c, k) => Object.values(c.risks).filter(r => r.kind === k).reduce((s, r) => s + r.count, 0);
const decisionParts = c => [{v: c.paid, color: C.paid, name: t("지급", "paid")}, {v: c.escalated, color: C.escalated, name: t("보류", "held")},
                            {v: c.rejected, color: C.rejected, name: t("거절", "rejected")}];
function topRisk(c) {
  const e = Object.entries(c.risks).sort((a, b) => (b[1].kind === "fraud") - (a[1].kind === "fraud") || b[1].count - a[1].count)[0];
  return e ? `<span class="${e[1].kind === "fraud" ? "bad" : "warn"}">${esc(riskName(e[0], e[1].label))} ${e[1].count}</span>` : `<span class="mute">–</span>`;
}
function statusBoard(o) {
  const maxR = Math.max(1, ...o.clients.map(c => riskSum(c, "fraud") + riskSum(c, "control")));
  return `<div class="board">
    <div class="hd">${t("고객사", "Client")}</div><div class="hd">${t("상태", "Status")}</div><div class="hd">${t("승인 대기", "Waiting")}</div>
    <div class="hd opt">${t("이달 지급 / 월 한도", "Paid / monthly limit")}</div><div class="hd">${t("위험 신호 (사기 · 통제)", "Risk signals (fraud · control)")}</div><div class="hd opt">${t("가장 큰 위험", "Top risk")}</div>

async function agentAct(cid, what) {
  try { await post(`/api/clients/${cid}/agent/${what}`, what === "kill" ? {note: $("killnote").value} : {}); route(); } catch (e) { alert(e.message); }
}
async function saveSettings(cid) {
  const actions = [...document.querySelectorAll(".actchk")].filter(x => x.checked).map(x => x.value);
  try { await post(`/api/clients/${cid}/agent/settings`, {max_single_chf: Number($("cap").value), actions}); route(); }
  catch (e) { $("sstatus").textContent = e.message; }
}
async function revokeMandate(cid) {
  if (!confirm(t("고객이 위임을 취소하는 상황을 시연할까요? 이 고객사의 에이전트는 더 이상 일할 수 없어요.", "Simulate the client revoking its mandate? Its agent can no longer act for it."))) return;
  await post(`/api/clients/${cid}/revoke`); route();
}
async function publishLessons(cid) {
  $("lstatus").textContent = t("Apertus에게 요청 중…", "asking Apertus…");
  try { await post(`/api/clients/${cid}/lessons/publish`); route(); } catch (e) { $("lstatus").textContent = e.message; }
}
async function attackGate(cid, kind) {
  try { const r = await post(`/api/clients/${cid}/attack/${kind}`); $("astatus").textContent = r.ok ? t("통과?!", "accepted?!") : `${t("문지기가 막음", "blocked by the gate")}: ${gateName(r.gate)}`; setTimeout(route, 1500); }
  catch (e) { $("astatus").textContent = e.message; }
}

function actionChart(rows) {
  const by = {}; rows.forEach(e => by[e.action] = (by[e.action] || 0) + 1);
  return bars(Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({label: actName(k), v, color: k === "request.rejected" ? C.rejected : C.control})));
}
